name: deep-formula-smoke
profile: smoke
model:
  input_dim: 1
  hidden_units: 4
  edges_per_unit: 2
  num_blocks: 4
  primitives: [const, x, x2, sin, cos, exp]
  readout: fixed_sum
  unit_gates: false
  dtype: float64
training:
  seed: 42
  adam_epochs: 5
  learning_rate: 0.005
  weight_decay: 0.0
  tau_start: 4.0
  tau_end: 0.5
  selection_weight_end: 0.01
  nms_weight: 0.1
  lbfgs_steps: 0
problem:
  type: supervised
  target: exp(sin(x^2) + cos(x))
  domain: [-2.0, 2.0]
  train_samples: 384
  val_samples: 128
provenance:
  purpose: code-path smoke test for deep formula discovery
  source_scope: adapted from KindXiaoming/pykan Example_3_deep_formula tutorial
