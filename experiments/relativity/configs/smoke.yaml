name: relativity-addition-smoke
profile: smoke
model:
  input_dim: 2
  hidden_units: 4
  edges_per_unit: 2
  num_blocks: 3
  primitives: [const, x, x2, log, exp, tanh, inv, sin, cos]
  readout: fixed_sum
  unit_gates: false
  dtype: float64
training:
  seed: 42
  adam_epochs: 5
  learning_rate: 0.005
  weight_decay: 0.0
  tau_start: 4.0
  tau_end: 0.5
  selection_weight_end: 0.01
  nms_weight: 0.1
  lbfgs_steps: 0
problem:
  type: supervised
  target: tanh(artanh(v1) + artanh(v2))
  domain: [-0.95, 0.95]
  train_samples: 400
  val_samples: 200
provenance:
  purpose: code-path smoke test for relativistic velocity addition
  source_scope: adapted from KindXiaoming/pykan Example_10_relativity-addition tutorial
