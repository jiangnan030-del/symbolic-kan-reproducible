name: Bug report
description: Report a reproducible software defect in this derivative package.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not use this form to attribute derivative-package behavior to the upstream authors.
  - type: input
    id: commit
    attributes:
      label: Package version or commit
      placeholder: 0.1.0a1 or a full Git SHA
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Experiment profile
      options:
        - legacy
        - paper
        - corrected
        - smoke
        - not applicable
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Python, PyTorch, OS, device, dtype, and relevant hardware.
      placeholder: Python 3.12, PyTorch 2.x, Ubuntu, CPU, float64
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the exact command, resolved configuration, seed, and smallest code sample that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Remove secrets and attach only logs needed to diagnose the issue.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I have not described derivative-package output as an upstream paper result.
          required: true
